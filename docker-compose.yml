services:
  python-parser:
    build: .
    container_name: log-insight-parser
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  vector:
    image: timberio/vector:0.34.1-alpine
    container_name: log-insight-vector
    command: ["--config", "/etc/vector/vector.toml"]
    ports:
      - "8686:8686"  # Vector API
      - "5001:5000"  # Logback TCP socket (host:5001 -> container:5000)
      - "8080:8080"  # HTTP endpoint for testing
    volumes:
      - ./vector.toml:/etc/vector/vector.toml:ro
      - vector-data:/var/lib/vector
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      python-parser:
        condition: service_healthy

volumes:
  vector-data:
